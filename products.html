    }
  ];

  const SNEHA_ALL_PRODUCTS = SNEHA_PRODUCT_CATEGORIES.flatMap((cat) =>
    cat.products.map((p) => ({ ...p, categoryId: cat.id, categoryName: cat.name }))
  );

  // ===== PAGE RENDER LOGIC =====
  document.addEventListener('DOMContentLoaded', function() {
    const productGrid = document.getElementById('product-grid');
    const filterButtons = document.querySelectorAll('.filter-btn');
    let currentFilter = 'all';

    function getBetterImageUrl(url) {
      if (!url) return '';
      return url
        .replace(/125x125/g, '400x400')
        .replace(/120x120/g, '400x400')
        .replace(/-125x125/g, '-400x400')
        .replace(/small/g, 'large')
        .replace(/thumb/g, 'original');
    }

    function renderProducts(categoryId) {
      let products = SNEHA_ALL_PRODUCTS;
      if (categoryId !== 'all') {
        products = SNEHA_ALL_PRODUCTS.filter(p => p.categoryId === categoryId);
      }

      if (products.length === 0) {
        productGrid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No products found in this category.</div>`;
        return;
      }

      productGrid.innerHTML = products.map((p, index) => {
        const imgSrc = getBetterImageUrl(p.image) || 'https://5.imimg.com/data5/SELLER/Default/2024/8/441408889/YL/HB/SH/36451235/tungsten-carbide-dies-400x400.jpg';
        return `<div class="product-item" data-category="${p.categoryId}" data-product-id="${p.id}" style="animation-delay:${index * 0.05}s">
          <img src="${imgSrc}" alt="${p.name}" loading="lazy" onerror="this.src='https://5.imimg.com/data5/SELLER/Default/2024/8/441408889/YL/HB/SH/36451235/tungsten-carbide-dies-400x400.jpg'">
          <div class="product-overlay">
            <span class="badge">${p.categoryName}</span>
            <h3>${p.name}</h3>
            <a href="#" class="view-link" data-product-id="${p.id}">View Details <i class="fa-solid fa-arrow-right"></i></a>
          </div>
        </div>`;
      }).join('');

      document.querySelectorAll('.view-link').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const productId = this.getAttribute('data-product-id');
          const product = SNEHA_ALL_PRODUCTS.find(p => p.id === productId);
          if (product) openModal(product);
        });
      });

      document.querySelectorAll('.product-item').forEach((el, i) => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(20px)';
        setTimeout(() => {
          el.style.transition = 'all 0.5s ease';
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        }, 100 + i * 80);
      });
    }

    filterButtons.forEach(button => {
      button.addEventListener('click', function() {
        filterButtons.forEach(btn => btn.classList.remove('active-filter'));
        this.classList.add('active-filter');
        currentFilter = this.getAttribute('data-filter');
        renderProducts(currentFilter);
      });
    });

    // ===== MODAL LOGIC =====
    const modal = document.getElementById('productModal');
    const modalClose = document.getElementById('modalClose');

    function openModal(product) {
      const imgSrc = getBetterImageUrl(product.image) || 'https://5.imimg.com/data5/SELLER/Default/2024/8/441408889/YL/HB/SH/36451235/tungsten-carbide-dies-400x400.jpg';
      
      document.getElementById('modalBadge').textContent = product.categoryName || 'Product';
      document.getElementById('modalTitle').textContent = product.name;
      document.getElementById('modalPrice').textContent = product.price || 'Price on Request';
      document.getElementById('modalImage').src = imgSrc;
      document.getElementById('modalImage').alt = product.name;
      document.getElementById('modalDescription').textContent = product.description || 'High-quality tungsten carbide product manufactured to industrial standards.';

      const specsList = document.getElementById('modalSpecsList');
      specsList.innerHTML = '';
      if (product.specs && product.specs.length > 0) {
        document.getElementById('modalSpecs').style.display = 'block';
        product.specs.forEach(spec => {
          const li = document.createElement('li');
          li.textContent = spec;
          specsList.appendChild(li);
        });
      } else {
        document.getElementById('modalSpecs').style.display = 'none';
      }

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (modal.classList.contains('active')) {
        if (e.key === 'Escape') closeModal();
      }
    });

    renderProducts('all');
  });
</script>

<script src="js/main.js"></script>
<script src="js/animation.js"></script>
</body>
</html>
